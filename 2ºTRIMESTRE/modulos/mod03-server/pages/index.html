<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Doce Swing - Site Oficial</title>
    <style>
        /* Importação de fontes modernas */
        @import url('https://googleapis.com');

        /* Variáveis de estilo CSS Moderno */
        :root {
            --primary: #ff4757;
            --secondary: #ffa502;
            --dark: #1e1e24;
            --light: #f1f2f6;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        /* Configurações Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Plano de fundo usando padrão geométrico estilizado simulado via Base64 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.25;
            background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCIgdmlld0JveD0iMCAwIDYwIDYwIj48cGF0aCBkPSJNMzAgMEw2MCAzMEwzMCA2MEwwIDMwWiIgZmlsbD0iI2ZmNDc1NyIgZmlsbC1vcGFjaXR5PSIuMSIvPjwvc3ZnPg==");
            background-size: 60px 60px;
        }

        /* Cabeçalho da Página */
        header {
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 30, 37, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 1px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Banner Hero Centralizado */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        .hero-card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(0);
            transition: all 0.4s ease;
        }

        .hero-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 71, 87, 0.4);
            box-shadow: 0 25px 50px rgba(255, 71, 87, 0.15);
        }

        /* Imagem Redonda do Grupo em Base64 */
        .band-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            border: 4px solid transparent;
            background: var(--gradient) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .band-img::after {
            content: '';
            position: absolute;
            width: 114px;
            height: 114px;
            border-radius: 50%;
            /* Imagem Abstrata Representando Roda de Samba / Instrumentos (Mapeada via Base64) */
            background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUgMTAwIj48L2NpcmNsZT48cGF0aCBkPSJNNTAgMTUgQTUgNSAwIDAgMSA1MCA4NSBBNSA1IDAgMCAxIDUwIDE1IiBmaWxsPSJub25lIiBzdHJva2U9IiNmZmE1MDIiIHN0cm9rZS13aWR0aD0iNCIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iNTAiIHI9IjE1IiBmaWxsPSIjZmY0NzU3Ii8+PC9zdmc+");
            background-size: cover;
        }

        h3 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--secondary);
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #a4b0be;
            margin-bottom: 2.5rem;
        }

        /* Link Estilizado como Botão Moderno */
        .btn-modern {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            background: var(--gradient);
            color: #fff;
            text-decoration: none;
            padding: 1rem 2.2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
            width: 100%;
        }

        .btn-modern:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 24px rgba(255, 71, 87, 0.5);
            filter: brightness(1.1);
        }

        /* Rodapé Simples */
        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.85rem;
            color: #57606f;
            border-top: 1px solid var(--glass-border);
        }

        /* Ícones SVG em linha */
        .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <header>
        <div class="logo">
            <!-- Ícone de Nota Musical (SVG Inline) -->
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            Doce Swing
        </div>
    </header>

    <main>
        <div class="hero-card">
            <div class="band-img"></div>
            <h3>Página Inicial</h3>
            <div class="subtitle">O melhor do Pagode & Samba</div>
            <p>Olá, seja muito bem-vindo à nossa casa! Sinta a energia do tantan, do pandeiro e do cavaco. Fique por dentro de nossa agenda de shows e novos lançamentos.</p>
            
            <a href="/Sobre" class="btn-modern">
                Conheça a nossa história
                <!-- Ícone de Seta para a Direita (SVG Inline) -->
                <svg class="icon" viewBox="0 0 24 24"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42 5.43 5.43H5v2z"/></svg>
            </a>
        </div>
    </main>

    <footer>
        &copy; 2026 Grupo Doce Swing. Todos os direitos reservados.
    </footer>

</body>
</html>
